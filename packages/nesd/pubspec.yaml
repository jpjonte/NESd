name: nesd
description: "NES emulator"
publish_to: 'none'

version: 0.17.0

environment:
  sdk: '>=3.12.0 <4.0.0'

resolution: workspace

dependencies:
  archive: ^4.2.0
  auto_route: ^11.1.0
  binarize: ^2.0.0
  build_runner: ^2.16.0
  collection: ^1.19.1
  crypto: ^3.0.7
  es_compression: ^2.0.15
  ffi: ^2.2.0
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_launcher_icons: ^0.14.4
  flutter_material_design_icons: ^3.1.0+7447
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  gamepads: ^0.1.11
  hooks_riverpod: ^3.4.2
  idb_shim: ^2.9.8
  image: ^4.9.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  nesd_audio: ^0.1.0
  nesd_texture: ^0.0.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  riverpod_generator: ^4.0.8
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  web: ^1.1.1
  xml: ^7.0.1

dev_dependencies:
  auto_route_generator: ^10.6.0
  cross_file: ^0.3.5+5
  dart_code_metrics_presets: ^2.33.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

  freezed: ^4.0.1
  json_serializable: ^6.14.1
  lint: ^2.8.0
  mocktail: ^1.0.5
  riverpod_lint: ^3.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/

  shaders:
    - shaders/crt.frag
    - shaders/smooth.frag

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
    - family: Ubuntu Mono
      fonts:
        - asset: assets/fonts/UbuntuMono-Regular.ttf
        - asset: assets/fonts/UbuntuMono-Italic.ttf
          style: italic
