server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/javascript application/wasm
               text/css application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store" always;
    }

    # make sure .mjs has the correct mime type so browsers accept it
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }
}
