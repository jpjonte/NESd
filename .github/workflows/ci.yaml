name: CI pipeline
on: [push]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      build-relevant: ${{ steps.filter.outputs.build-relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build-relevant:
              - 'packages/**'
              - '.fvmrc'
              - 'macos/**'
              - 'linux/**'
              - 'windows/**'
              - 'android/**'
              - 'ci/1-build/web/**'

  lint:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jpjonte/flutter:stable-ci
    steps:
      - uses: actions/checkout@v7
      - run: flutter pub get
      - run: dart pub get
        working-directory: website
      - run: dart format --set-exit-if-changed .
      - run: dart analyze packages/nesd packages/nesd_texture packages/nesd_audio website

  check-play-listing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ci/check/android/play_listing.sh

  check-pages-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ci/check/website/pages_gate.sh

  check-linux-packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ci/check/linux/packaging.sh

  check-game-counts:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jpjonte/flutter:stable-ci
    steps:
      - uses: actions/checkout@v7
      - run: flutter pub get
      - run: dart run tool/update_game_counts.dart --check
        working-directory: packages/nesd

  test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jpjonte/flutter:stable-ci
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - run: flutter pub get
      - run: bin/build_test_libs.sh
      - run: |
          cd packages/nesd
          flutter test --coverage
      - run: ci/0-test/extract_coverage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: pages/coverage/main.json
          if-no-files-found: error

  test-web:
    # run the web tests directly on the runner (Chrome is preinstalled)
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: ci/0-test/web_test.sh

  test-site:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jpjonte/flutter:stable-ci
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - run: |
          dart pub get
          dart test
        working-directory: website

  pages-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [check-pages-gate]
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        run: website/tool/pages_gate.sh

  publish-pages:
    if: github.ref == 'refs/heads/main' && needs.pages-gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    needs: [test, test-site, pages-gate, build-web, check-game-counts]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: ./.github/actions/pages

  publish-pages-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [test, test-site, release, build-web, check-game-counts]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: ./.github/actions/pages

  build-macos:
    runs-on: macos-latest
    needs: [test]
    outputs:
      release_name: ${{ steps.env.outputs.release_name }}
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.GAMEPADS_PRIVATE_KEY }}
      - run: ci/1-build/prepare.sh
      - run: ci/1-build/macos/prepare.sh
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      - run: ci/1-build/macos/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_FLAVORED }}.macos-universal.dmg
          path: '*.dmg'
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: [ test ]
    env:
      ARCH: ${{ matrix.arch }}
    container:
      image: ubuntu:22.04
    steps:
      - name: Bootstrap container
        run: |
          apt-get update -y
          # zstd is required for actions/cache to work correctly
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git jq unzip xz-utils zip zstd
          curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: subosito/flutter-action@v2
        with:
          # Flutter doesn't publish arm64 tarballs for versions, use master instead
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: ci/1-build/prepare.sh
      - run: ci/1-build/linux/build.sh
      - name: Archive bundle
        run: |
          tar -C packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release \
            -cf linux-bundle-${{ matrix.arch }}.tar bundle
      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle-${{ matrix.arch }}
          path: linux-bundle-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v7
      - run: ci/1-build/windows/prepare.ps1
      - id: env
        uses: ./.github/actions/env
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: ci/1-build/windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}.windows-x64.zip
          path: dist/
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jpjonte/flutter:stable-android-ci
    needs: [ test ]
    env:
      GRADLE_USER_HOME: /root/.gradle
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: gradle-build-${{ github.sha }}
          restore-keys: gradle-build-
      - run: ci/1-build/prepare.sh
      - run: ci/1-build/android/prepare.sh
        env:
          KEY_STORE_BASE64: ${{ secrets.ANDROID_KEY_STORE }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      - run: ci/1-build/android/build.sh
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
          key: gradle-build-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_FLAVORED }}.android.apk
          path: '*.apk'
          if-no-files-found: error
      - name: Upload Play bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: play-bundle
          path: |
            packages/nesd/build/app/outputs/bundle/prodRelease/*.aab
            packages/nesd/android/gradlew
            packages/nesd/android/gradle/wrapper/gradle-wrapper.jar
            packages/nesd/android/local.properties
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jpjonte/flutter:stable-ci
    needs: [test, test-web]
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$(pwd)"
      - run: flutter pub get
      - run: ci/1-build/web/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: packages/nesd/build/web
          if-no-files-found: error

  publish-play:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jpjonte/flutter:stable-android-ci
    needs: [ build-android, check-play-listing ]
    env:
      PLAY_TRACK: alpha
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: play-bundle
          path: play-bundle
      - name: Restore bundle and Gradle inputs
        run: |
          mkdir -p packages/nesd/build/app/outputs/bundle/prodRelease
          mkdir -p packages/nesd/android/gradle/wrapper
          cp play-bundle/build/app/outputs/bundle/prodRelease/*.aab \
            packages/nesd/build/app/outputs/bundle/prodRelease/
          cp play-bundle/android/gradlew packages/nesd/android/gradlew
          cp play-bundle/android/gradle/wrapper/gradle-wrapper.jar \
            packages/nesd/android/gradle/wrapper/gradle-wrapper.jar
          cp play-bundle/android/local.properties \
            packages/nesd/android/local.properties
          chmod +x packages/nesd/android/gradlew
      - name: Materialize the Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" \
            | tr -d ' \t\n\r' \
            | base64 --decode \
            > packages/nesd/android/play-service-account.json
      - run: ci/3-release/publish_play.sh

  publish-docker:
    if: >-
      (github.ref == 'refs/heads/main' &&
       needs.detect-changes.outputs.build-relevant == 'true') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [detect-changes, build-web]
    permissions:
      contents: read
      packages: write
    env:
      # *.dockerbuild record artifacts break the release jobs' bulk
      # download-artifact steps (docker/build-push-action#1255)
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: ci/2-package/web/web
      - id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=ghcr.io/jpjonte/nesd:$VERSION,ghcr.io/jpjonte/nesd:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/jpjonte/nesd:nightly" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a host-arch image for verification
        uses: docker/build-push-action@v7
        with:
          context: ci/2-package/web
          load: true
          tags: nesd-web:verify
      - run: ci/2-package/web/verify.sh nesd-web:verify
      - uses: docker/build-push-action@v7
        with:
          context: ci/2-package/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  package-linux-deb:
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: [ build-linux, check-linux-packaging ]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle-${{ matrix.arch }}
      - name: Unpack bundle
        run: |
          mkdir -p packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release
          tar -C packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release \
            -xf linux-bundle-${{ matrix.arch }}.tar
      - run: ci/2-package/linux/package_deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_FLAVORED }}.linux-${{ matrix.arch }}.deb
          path: '*.deb'
          if-no-files-found: error

  package-linux-rpm:
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: [ build-linux, check-linux-packaging ]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle-${{ matrix.arch }}
      - name: Unpack bundle
        run: |
          mkdir -p packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release
          tar -C packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release \
            -xf linux-bundle-${{ matrix.arch }}.tar
      - run: ci/2-package/linux/package_rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_FLAVORED }}.linux-${{ matrix.arch }}.rpm
          path: '*.rpm'
          if-no-files-found: error

  package-linux-flatpak:
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: [ build-linux, check-linux-packaging ]
    env:
      ARCH: ${{ matrix.arch }}
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          git config --global --add safe.directory $(pwd)
          sudo dnf install -y yq jq ostree
      - id: env
        uses: ./.github/actions/env
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle-${{ matrix.arch }}
      - name: Unpack bundle
        run: |
          mkdir -p packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release
          tar -C packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release \
            -xf linux-bundle-${{ matrix.arch }}.tar
      - uses: actions/checkout@v7
        with:
          repository: jpjonte/flatpak
          ssh-key: ${{ secrets.FLATPAK_PRIVATE_KEY }}
          ref: main
          path: flatpak
      - run: ln -s flatpak/stable repo
      - id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.FLATPAK_STABLE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_STABLE_GPG_PASSPHRASE }}
      - uses: andyholmes/flatter@main
        with:
          files: packages/nesd/linux/packaging/flatpak/${{ env.FLATPAK_ID }}.json
          arch: ${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          cache-key: ''
      - run: ci/2-package/linux/package_flatpak.sh
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_FLAVORED }}.linux-${{ matrix.arch }}.flatpak
          path: '*.flatpak'
          if-no-files-found: error
      - run: ci/2-package/linux/export_flatpak_refs.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: flatpak-export
          if-no-files-found: error

  package-linux-appimage:
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: [ build-linux, check-linux-packaging ]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - id: env
        uses: ./.github/actions/env
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle-${{ matrix.arch }}
      - name: Unpack bundle
        run: |
          mkdir -p packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release
          tar -C packages/nesd/build/linux/${{ matrix.arch }}/${{ env.FLAVOR }}/release \
            -xf linux-bundle-${{ matrix.arch }}.tar
      - run: ci/2-package/linux/package_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_FLAVORED }}.linux-${{ matrix.arch }}.AppImage
          path: '*.AppImage'
          if-no-files-found: error

  release_nightly:
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.build-relevant == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: flatpak-push
      cancel-in-progress: false
    needs:
      - detect-changes
      - build-macos
      - package-linux-deb
      - package-linux-rpm
      - package-linux-flatpak
      - package-linux-appimage
      - build-windows
      - build-android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: jpjonte/flatpak
          ssh-key: ${{ secrets.FLATPAK_PRIVATE_KEY }}
          ref: main
          path: flatpak
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-repo-x64
          path: flatpak-export/x64
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-repo-arm64
          path: flatpak-export/arm64
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends flatpak ostree
      - id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.FLATPAK_STABLE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_STABLE_GPG_PASSPHRASE }}
      - run: ci/3-release/merge_flatpak_repo.sh flatpak/stable flatpak-export/x64 flatpak-export/arm64
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update NESd nightly
          commit_user_name: NESd CI Pipeline
          commit_user_email: nesd@jpj.dev
          commit_author: NESd CI Pipeline <nesd@jpj.dev>
          repository: flatpak
          skip_fetch: true
          skip_checkout: true
      - id: changelog
        run: ci/3-release/extract_changelog_nightly.sh
      - uses: actions/download-artifact@v8
        with:
          pattern: '!@(coverage-badge|flatpak-repo-*|web-build)'
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web-build
      - id: env
        uses: ./.github/actions/env
      - run: ci/3-release/zip_windows_artifacts.sh
      - run: ci/3-release/zip_web_artifact.sh
      - run: gh release delete nightly --cleanup-tag -y
      - uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/*
          name: NESd nightly
          tag: nightly
          body: ${{ steps.changelog.outputs.changes }}
          artifactErrorsFailBuild: true
          prerelease: true
          allowUpdates: true
          removeArtifacts: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    concurrency:
      group: flatpak-push
      cancel-in-progress: false
    needs:
      - build-macos
      - package-linux-deb
      - package-linux-rpm
      - package-linux-flatpak
      - package-linux-appimage
      - build-windows
      - build-android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: jpjonte/flatpak
          ssh-key: ${{ secrets.FLATPAK_PRIVATE_KEY }}
          ref: main
          path: flatpak
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-repo-x64
          path: flatpak-export/x64
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-repo-arm64
          path: flatpak-export/arm64
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends flatpak ostree
      - id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.FLATPAK_STABLE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FLATPAK_STABLE_GPG_PASSPHRASE }}
      - run: ci/3-release/merge_flatpak_repo.sh flatpak/stable flatpak-export/x64 flatpak-export/arm64
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update NESd stable
          commit_user_name: NESd CI Pipeline
          commit_user_email: nesd@jpj.dev
          commit_author: NESd CI Pipeline <nesd@jpj.dev>
          repository: flatpak
          skip_fetch: true
          skip_checkout: true
      - id: changelog
        run: ci/3-release/extract_changelog.sh
      - uses: actions/download-artifact@v8
        with:
          pattern: '!@(play-bundle|coverage-badge|flatpak-repo-*|web-build)'
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web-build
      - id: env
        uses: ./.github/actions/env
      - run: ci/3-release/zip_windows_artifacts.sh
      - run: ci/3-release/zip_web_artifact.sh
      - uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/*
          name: NESd ${{ needs.build-macos.outputs.release_name }}
          body: ${{ steps.changelog.outputs.changes }}
          artifactErrorsFailBuild: true
